# ChargeShield-FL — ChargePlace Scotland, 32 client (una local authority per client)
# Creato il 2026-10-13. Piano: docs/ESPERIMENTI.md, "Validazione della metodologia oltre ACN".
#
# Scelte, da confermare con il pilota:
# - Client: tutte le 32 local authority, con TUTTE le loro sessioni (nessun sottocampionamento,
#   decisione dell'autrice del 2026-10-13). Le 17383 sessioni senza local authority sono escluse:
#   con la lista vuota il codice le userebbe come un 33esimo client "".
#   Conteggi verificati il 2026-10-13: da 260347 (Glasgow City) a 12322 (Na h-Eileanan an Iar),
#   3103044 sessioni in tutto.
# - Feature: le 4 informative delle 6 storiche di ACN. kwh_requested e minutes_available non
#   esistono in questo dataset (sempre 0) e sono tolte invece di tenerle costanti.
# - Protocollo del regime naturale di ACN (config/experiment.yaml): 10 round, 50 epoche.
#
# Pilota (prima di qualunque campagna): 1 run senza DP, seed 42, per misurare i tempi.

experiment:
  name: chargeshield_scotland_32client
  fl_rounds: 10
  seed: 42
  epsilon: 1.0
  delta: 1.0e-05
  max_grad_norm: 1.0
dataset_adapter: chargeplace_scotland
chargeplace_scotland:
  metadata_dir: datasets/alt/chargeplace_scotland/CPID_information
  clients:
  - Glasgow City
  - East Ayrshire
  - City of Edinburgh
  - North Lanarkshire
  - Dundee City
  - Stirling
  - South Lanarkshire
  - Renfrewshire
  - Fife
  - Perth and Kinross
  - South Ayrshire
  - Highland
  - West Lothian
  - East Lothian
  - Aberdeenshire
  - Aberdeen City
  - Falkirk
  - Angus
  - Scottish Borders
  - East Dunbartonshire
  - East Renfrewshire
  - North Ayrshire
  - Dumfries and Galloway
  - Midlothian
  - Argyll and Bute
  - Clackmannanshire
  - West Dunbartonshire
  - Moray
  - Inverclyde
  - Orkney Islands
  - Shetland Islands
  - Na h-Eileanan an Iar
  session_files:
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/October22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/November22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/DEC-22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JAN-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/FEB-2023.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/March23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/April23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/MAY23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JUNE-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JULY-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/AUG-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/SEP-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/OCT-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/NOV-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/DEC-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JAN-24.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/FEB-24.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/MARCH-24.xlsx
ml:
  input_dim: 4
  lr: 0.001
  epochs: 50
  batch_size: 32
  proximal_mu: 0.01
  feature_names:
  - total_energy_kwh
  - max_power_kw
  - hour_of_day
  - duration_hours
output:
  experiments_dir: experiments
lira:
  n_shadow: 16
byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10
