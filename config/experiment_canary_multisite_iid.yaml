# Claim 4 (2026-10-13): la partizione cambia il leakage RILEVABILE? Nel regime naturale gli attacchi sono al
# caso con entrambe le partizioni (E-D su ACN), quindi il confronto si fa dove il leakage si vede: il canary.
# Identico a experiment_canary_multisite.yaml tranne partition.strategy = iid: i canary sono iniettati nel sito come sempre (prima della
# partizione), poi le sessioni di training sono rimescolate fra i client con le stesse numerosita', quindi le
# copie dei canary finiscono in tutti i client invece che solo nel client piccolo. Metrica: come il canary per
# sito (somma A+B delle AUC grezze del modello globale, round 1), confrontata col braccio per sito stesso seed,
# stessa macchina. Previsione scritta prima: con IID il canary pesa nell'aggregato con il peso dei client grandi
# invece che con quello del client piccolo, quindi la somma A+B e' piu' alta che per sito.

# ChargeShield-FL — Canary su più siti, braccio A (2026-09-30)
#
# SCOPO: validare lo strumento canary in federazione, prerequisito per leggere
# la DP client-level (docs/ESPERIMENTI.md, "Canary su più siti"). Tutte le run
# canary precedenti hanno un solo client (Office 1), dove l'update del client e
# il modello globale coincidono.
#
# Identico a experiment_canary_balanced.yaml (k = 20 template per lato, 30
# duplicati, paired_split, 7 feature, hidden_dims (32, 16), latent 8, 1000
# epoche, 3 round, LiRA n_shadow 8 con shadow cold) tranne due righe:
#   - sites: i tre siti reali, come i config RQ;
#   - experiment.name.
# Le motivazioni del protocollo bilanciato sono nell'header di quel file.
#
# I canary restano iniettati solo in Office 1 (canary.site). Con lo split del
# seed 42 Office 1 passa da circa 1341 a circa 1921 sessioni di training
# (+600 duplicati, -20 template non-membro spostati nell'holdout), circa il
# 3.6% del training federato. Il peso di Office 1 nella media FedAvg conta anche
# i duplicati: da dichiarare.
#
# Superfici, dai default del codice: LiRA osserva il modello di ciascun client
# (lira.observation_surface "client"), quindi l'update di Office 1, superficie
# primaria; Yeom e Shadow valutano i canary solo sul modello globale ("global"),
# dopo la diluizione. Le due letture stanno nello stesso JSON.
#
# Normalizzazione: min e max sono calcolati sul training dei tre siti, quindi i
# valori normalizzati dei canary non sono quelli delle run a un solo sito. La
# baseline a init casuale (check_canary_init_confound.py) va rifatta con questo
# config e lo stesso --seed, per entrambi i bracci.
#
# Inizializzazione: ogni client parte dalla propria (segnalazione 48), come nelle
# campagne RQ.
#
# Prima run: seed 42, senza DP, per verificare iniezione e punteggi con tre
# client e misurare il tempo. Numero di epoche e LiRA completo o solo loss grezza
# per la campagna si decidono col supervisore dopo questa run.

experiment:
  name: chargeshield_canary_multisite_iid
  fl_rounds: 3
  seed: 42
  epsilon: 1.0
  delta: 1.0e-5
  max_grad_norm: 1.0

sites:
  caltech:
    - datasets/acn/caltech/acndata_sessions_2018.json
    - datasets/acn/caltech/acndata_sessions_2019.json
    - datasets/acn/caltech/acndata_sessions_2020.json
    - datasets/acn/caltech/acndata_sessions_2021.json
  jpl:
    - datasets/acn/jpl/acndata_sessions_2018.json
    - datasets/acn/jpl/acndata_sessions_2019.json
    - datasets/acn/jpl/acndata_sessions_2020.json
    - datasets/acn/jpl/acndata_sessions_2021.json
  office1:
    - datasets/acn/office1/acndata_sessions_2019.json
    - datasets/acn/office1/acndata_sessions_2020.json
    - datasets/acn/office1/acndata_sessions_2021.json
    # Nessun 2018: non disponibile per Office 1 su ev.caltech.edu.

ml:
  input_dim: 7
  lr: 0.001
  epochs: 1000
  batch_size: 32
  proximal_mu: 0.01
  hidden_dims: [32, 16]
  latent_dim: 8
  feature_names:
    - total_energy_kwh
    - max_power_kw
    - kwh_requested
    - minutes_available
    - hour_of_day
    - duration_hours
    - start_time_epoch

canary:
  enabled: true
  site: office1              # canary iniettati solo in Office 1
  nonmember_source: paired_split
  swap_assignment: false      # braccio A
  n_templates: 20             # == n_nonmember_templates: condizione dello scambio
  n_duplicates: 30
  n_nonmember_templates: 20

output:
  experiments_dir: experiments

lira:
  n_shadow: 8
  # shadow_init: cold (aggiunto 2026-09-16, dopo lo smoke test s42).
  # OMESSO per errore nella prima stesura di questi config: i config
  # _canary_maxmemo{,_swap} da cui questo design deriva lo impostano a
  # "cold", mentre il default del codice e' "warm" (run_experiments.py:3250,
  # _warm_start attivo dal round 2). Lo smoke test s42 ha quindi girato con
  # gli shadow warm-start mentre la campagna a 5 seed di riferimento girava
  # cold: una variabile non controllata fra le due campagne, che tocca la
  # calibrazione shadow e quindi canary_auc_roc (NON canary_raw_mse_auc_roc,
  # che e' calcolata sulla loss del modello target e non vede gli shadow).
  # Vedi anche Blocker 1 / Sprint 10zz+91: warm e cold non sono equivalenti
  # in questo regime.
  shadow_init: cold

byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10

partition:
  strategy: iid
