  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/MARCH-24.xlsx
ml:
  input_dim: 4
  lr: 0.001
  epochs: 50
  batch_size: 32
  proximal_mu: 0.1
  feature_names:
  - total_energy_kwh
  - max_power_kw
  - hour_of_day
  - duration_hours
output:
  experiments_dir: experiments
lira:
  n_shadow: 16
byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10
