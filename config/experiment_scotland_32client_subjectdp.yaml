# ChargeShield-FL — ChargePlace Scotland, 32 client, DP a livello di SOGGETTO
# Creato il 2026-10-13. Meccanismo e accounting: src/ml/subject_dp.py.
#
# Soggetto = colonnina (node_id, CPID). In questo dataset l'utente non esiste:
# proteggere la colonnina copre chi ricarica sempre alla stessa colonnina, non
# chi ne usa diverse. Ogni colonnina sta in una sola local authority (verificato
# il 2026-10-13: 2878 colonnine, nessuna in piu' client), quindi qui non servono
# i pesi fra client.
#
# Si lancia con --no-dp (la DP per client resta spenta: una cella per volta).
# Stesso protocollo del config senza DP (10 round, 50 epoche, 4 feature),
# norm group obbligatoria.
#
# Epsilon atteso (RDP, Poisson, delta 1e-5, E 50, T 10, 8 colonnine attese per
# passo) nel client con meno colonnine (23) / mediano (81) / con piu' (228):
#   sigma 2:  61 / 25 / 12.5
#   sigma 5:  16 / 7.5 / 4.0    <- scelto per il primo test
#   sigma 10: 6.8 / 3.3 / 1.8
# Con 5 epoche locali invece di 50, a sigma 5: 4.1 / 2.1 / 1.1. Il costo sul
# modello si misura con la run: va confrontato con la run senza DP.

experiment:
  name: chargeshield_scotland_32client_subjectdp
  fl_rounds: 10
  seed: 42
  epsilon: 1.0
  delta: 1.0e-05
  max_grad_norm: 1.0
dataset_adapter: chargeplace_scotland
chargeplace_scotland:
  metadata_dir: datasets/alt/chargeplace_scotland/CPID_information
  clients:
  - Glasgow City
  - East Ayrshire
  - City of Edinburgh
  - North Lanarkshire
  - Dundee City
  - Stirling
  - South Lanarkshire
  - Renfrewshire
  - Fife
  - Perth and Kinross
  - South Ayrshire
  - Highland
  - West Lothian
  - East Lothian
  - Aberdeenshire
  - Aberdeen City
  - Falkirk
  - Angus
  - Scottish Borders
  - East Dunbartonshire
  - East Renfrewshire
  - North Ayrshire
  - Dumfries and Galloway
  - Midlothian
  - Argyll and Bute
  - Clackmannanshire
  - West Dunbartonshire
  - Moray
  - Inverclyde
  - Orkney Islands
  - Shetland Islands
  - Na h-Eileanan an Iar
  session_files:
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/October22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/November22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/DEC-22.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JAN-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/FEB-2023.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/March23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/April23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/MAY23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JUNE-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JULY-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/AUG-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/SEP-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/OCT-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/NOV-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/DEC-23.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/JAN-24.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/FEB-24.xlsx
  - datasets/alt/chargeplace_scotland/Sessions_from_CPS/MARCH-24.xlsx
ml:
  input_dim: 4
  lr: 0.001
  epochs: 50
  batch_size: 32
  proximal_mu: 0.01
  feature_names:
  - total_energy_kwh
  - max_power_kw
  - hour_of_day
  - duration_hours
  norm: group
  subject_dp:
    enabled: true
    subject_key: node_id
    max_grad_norm: 1.0
    noise_multiplier: 5.0
    expected_subjects_per_step: 8
    max_records_per_subject: 64
output:
  experiments_dir: experiments
lira:
  n_shadow: 16
byzantine_attack:
  enabled: false
  attack_type: gradient_scaling
  byzantine_node: synthetic_1
  scale_factor: 10
